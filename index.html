<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="impact-site-verification" value="542e9681-75be-44b8-a4c7-a84bc7050674">
<meta name="theme-color" content="#0A0A10">
<title>DFW EDM &amp; House Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A10;
    --surface:#121219;
    --field:#15151D;
    --border:#2A2A36;
    --text:#F2F2F6;
    --sub:#C4C4D2;      /* time / venue: ~11:1 on --bg */
    --tertiary:#A1A1B5; /* labels, counts: ~7.5:1 on --bg */
    --pink:#F0479A;
    --purple:#8B5CF6;
    --on-pink:#14060D;  /* dark text on pink keeps 4.5:1+ */
    --green:#22C55E;
    /* One typeface everywhere: Inter Tight (Inter with tighter spacing). */
    --font:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  }
  h1,h2,h3,.wordmark,.ev-title,.wk-title,.section-title{letter-spacing:-0.005em;}
  a{color:inherit;text-decoration:none;}
  button,input,select{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--pink);outline-offset:2px;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* Header */
  .site-header{border-bottom:1px solid var(--border);position:relative;}
  .site-header .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-top:10px;padding-bottom:10px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
  .brand img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;flex:none;display:block;}
  .brand-text{min-width:0;flex:1;container-type:inline-size;}
  .wordmark{font-weight:700;font-size:18px;line-height:1.1;}
  /* One line at any width: the size scales with the space beside the logo
     (in Inter Tight the text is ~21.3x as wide as its font size), capped at 12.5px. */
  .tagline{
    display:block;color:var(--tertiary);line-height:1.35;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:12.5px;font-size:min(12.5px, 100cqi / 22.5);
  }
  .ig-link{
    width:44px;height:44px;flex:none;display:grid;place-items:center;
    background:var(--field);border:1px solid var(--border);border-radius:12px;
    transition:border-color .15s ease, color .15s ease;
  }
  .ig-link:hover{border-color:var(--pink);color:var(--pink);}
  .ig-link svg{width:22px;height:22px;}

  /* Search + chips */
  .controls{padding-top:14px;}
  .search{position:relative;}
  .search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--tertiary);pointer-events:none;}
  .search input{
    width:100%;height:48px;padding:0 14px 0 44px;
    background:var(--field);border:1px solid var(--border);border-radius:12px;
    font-size:15px;outline:none;
  }
  .search input::placeholder{color:var(--tertiary);}
  .search input:focus{border-color:var(--pink);}
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;margin:0 -16px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    position:relative;flex:none;display:inline-flex;align-items:center;gap:4px;
    height:36px;padding:0 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:var(--field);border:1px solid var(--border);color:var(--sub);
    font-weight:500;font-size:14px;
  }
  .chip:hover{border-color:#3A3A4A;color:var(--text);}
  .chip.active{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:600;}
  .chip select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
  .chip:has(select:focus-visible){outline:2px solid var(--pink);outline-offset:2px;}

  /* Clear filters: greyed out until something is filtered */
  .clear-row{display:flex;padding-top:4px;}
  .clear-btn{
    display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0;
    background:none;border:0;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--pink);
  }
  .clear-btn svg{width:14px;height:14px;}
  .clear-btn:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px;}
  .clear-btn:disabled{color:var(--tertiary);opacity:.55;cursor:default;}

  /* Sticky month row */
  .months{
    position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--border);margin-top:0;
  }
  .months-row{display:flex;gap:22px;overflow-x:auto;padding:0 16px;margin:0 -16px;scrollbar-width:none;}
  .months-row::-webkit-scrollbar{display:none;}
  .month{
    flex:none;background:none;border:0;cursor:pointer;padding:14px 0 11px;
    font-weight:600;font-size:13px;letter-spacing:.6px;
    color:var(--tertiary);border-bottom:2px solid transparent;
  }
  .month:hover{color:var(--text);}
  .month.active{color:var(--text);border-bottom-color:var(--pink);}

  /* Event list */
  main{padding-bottom:24px;}
  .month-head{
    font-weight:600;font-size:12px;letter-spacing:.8px;
    text-transform:uppercase;color:var(--tertiary);margin:26px 0 0;
  }
  .empty{color:var(--sub);font-size:14px;margin:10px 0 0;}
  .day-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin:22px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  .day-head h3{margin:0;font-weight:700;font-size:18px;}
  .day-count{font-weight:500;font-size:11.5px;letter-spacing:.6px;color:var(--tertiary);white-space:nowrap;}
  .day-count .soon{color:var(--pink);}
  .cards{display:grid;grid-template-columns:1fr;gap:10px;}
  @media (min-width:760px){ .cards{grid-template-columns:1fr 1fr;} }

  .ev{
    display:flex;gap:14px;padding:10px;border-radius:16px;
    background:var(--surface);border:1px solid var(--border);
  }
  .thumb{width:96px;height:120px;flex:none;border-radius:12px;overflow:hidden;background:#000;}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block;}
  .ev-body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;padding:2px 2px 0 0;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px;}
  .pill{
    display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;
    font-weight:600;font-size:11px;letter-spacing:.2px;
    color:var(--c);background:color-mix(in srgb, var(--c) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--c) 32%, transparent);
  }
  .pill.free{--c:var(--green);letter-spacing:.6px;}
  .ev-title{font-weight:700;font-size:16.5px;line-height:1.2;overflow-wrap:anywhere;}
  .lineup{font-size:13px;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .meta{font-size:13.5px;color:var(--sub);}
  .actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px;}
  .btn-tickets{
    display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:10px;
    background:var(--pink);color:var(--on-pink);font-weight:700;font-size:14px;
  }
  .btn-tickets:hover{filter:brightness(1.08);}
  .resale{font-size:12.5px;color:var(--tertiary);}
  .resale a{text-decoration:underline;text-underline-offset:2px;text-decoration-color:#4A4A5A;}
  .resale a:hover{color:var(--text);}
  .info-link{font-weight:600;font-size:14px;color:var(--green);}
  .info-link:hover{text-decoration:underline;}

  /* Every week carousel */
  /* Weekly series sit at the top, right under the month row. */
  .weekly{margin-top:18px;}
  .section-title{font-weight:700;font-size:18px;margin:0 0 10px;}
  .carousel{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;margin:0 -16px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;}
  .carousel::-webkit-scrollbar{display:none;}
  /* Weekly cards use the event-card layout (flyer left, details right),
     with a square flyer since promo images are mostly square. */
  .wk{flex:none;width:min(340px, 86vw);scroll-snap-align:start;}
  .thumb.square{width:104px;height:104px;align-self:flex-start;}
  .wk-when{font-weight:600;font-size:11.5px;letter-spacing:.6px;color:var(--pink);text-transform:uppercase;}

  .no-results{color:var(--sub);padding:36px 0;text-align:center;}

  footer.wrap{border-top:1px solid var(--border);margin-top:40px;padding-top:28px;padding-bottom:40px;}
  .fine{font-size:12.5px;color:var(--tertiary);margin:6px 0 0;}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <img src="logo.png" alt="">
      <span class="brand-text">
        <span class="wordmark">DFW EDM</span>
        <span class="tagline">Your home for Dallas-Fort Worth electronic music.</span>
      </span>
    </a>
    <a class="ig-link" href="https://www.instagram.com/dfw.edm/" target="_blank" rel="noopener" aria-label="DFW EDM on Instagram (@dfw.edm)" title="@dfw.edm on Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
  </div>
</header>

<div class="wrap controls">
  <label class="search">
    <span class="sr-only">Search artist or venue</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="searchInput" placeholder="Search artist or venue" autocomplete="off">
  </label>
  <div class="chips" role="group" aria-label="Filters">
    <button type="button" class="chip" data-when="tonight" aria-pressed="false">Tonight</button>
    <button type="button" class="chip" data-when="weekend" aria-pressed="false">This weekend</button>
    <label class="chip" id="genreChip"><span id="genreLabel">Genre</span> &#9662;
      <select id="genreSelect" aria-label="Genre"><option value="">All genres</option></select>
    </label>
    <label class="chip" id="venueChip"><span id="venueLabel">Venue</span> &#9662;
      <select id="venueSelect" aria-label="Venue"><option value="">All venues</option></select>
    </label>
  </div>
  <div class="clear-row">
    <button type="button" class="clear-btn" id="clearFilters" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      Clear filters
    </button>
  </div>
</div>

<nav class="months" aria-label="Months">
  <div class="wrap"><div class="months-row" id="monthTabs"></div></div>
</nav>

<main class="wrap">
  <section class="weekly" id="every-week" aria-labelledby="everyWeekTitle">
    <h2 class="section-title" id="everyWeekTitle">Every week</h2>
    <div class="carousel" id="weeklyContainer"></div>
  </section>
  <section id="upcoming" aria-label="Upcoming shows"><div id="eventsContainer"></div></section>
</main>

<footer class="wrap">
  <p class="fine">Refreshed every few days &middot; last updated <span id="lastUpdated"></span></p>
  <p class="fine" id="closedNote"></p>
</footer>

<script>
  // Bust browser caches every 10 minutes so new event lists show up promptly.
  document.write('<script src="events.js?v=' + Math.floor(Date.now() / 600000) + '"><\/script>');
</script>
<script>
function imgFallback(img){
  var rest = (img.getAttribute("data-fallbacks") || "").split("|").filter(Boolean);
  if(!rest.length){ img.onerror = null; img.style.visibility = "hidden"; return; }
  img.style.objectPosition = "";  // focus was for the flyer, not the venue logo
  img.setAttribute("data-fallbacks", rest.slice(1).join("|"));
  img.src = rest[0];
}
(function(){
  // The site's main genres (alphabetical) and their pill colors.
  var GENRE_COLORS = {
    "Bass": "#FB923C", "Downtempo": "#CBD5E1", "Drum & Bass": "#A3E635",
    "Dubstep": "#A78BFA", "Hard Dance": "#E879F9", "House": "#F5A524",
    "Techno": "#4C8DFF", "Trance": "#22D3EE", "Trap": "#F87171",
    "UK Bass / Garage": "#2DD4BF"
  };
  var MAIN_GENRES = Object.keys(GENRE_COLORS);
  var WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function parseDate(d){
    var p = d.split("-");
    return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  }
  function ymd(dt){
    return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
  }
  function addDays(d, n){ var dt = parseDate(d); dt.setDate(dt.getDate() + n); return ymd(dt); }
  // "Today" for filtering purposes is shifted 30 minutes late, so an event
  // dated today doesn't disappear right at midnight -- it stays up until
  // 12:30 AM the following day, since people sometimes head out last-minute.
  function todayStr(){ return ymd(new Date(Date.now() - 30 * 60 * 1000)); }
  // Friday through Sunday of the current week (from today if it's already the weekend).
  function weekendRange(today){
    var dow = parseDate(today).getDay();
    if(dow === 0) return [today, today];
    var fri = dow >= 5 ? today : addDays(today, 5 - dow);
    return [fri, addDays(today, 7 - dow)];
  }
  // "9:00 PM" -> "9 PM", "2:00 AM - 5:00 AM" -> "2–5 AM"
  function shortTime(t){
    if(!t) return "";
    var s = t.replace(/:00/g, "").replace(/\s*-\s*/g, "–");
    var m = s.match(/^(\d+(?::\d+)?)\s*(AM|PM)–(\d+(?::\d+)?)\s*(AM|PM)$/i);
    return m && m[2].toUpperCase() === m[4].toUpperCase() ? m[1] + "–" + m[3] + " " + m[4].toUpperCase() : s;
  }
  // Split a lineup off titles that already list one ("X ft. A, B", "X w/ A", "X | A + B").
  function splitTitle(artist){
    var m = artist.match(/^(.+?)\s+(?:ft\.?|feat\.?|w\/)\s+(.+)$/i) || artist.match(/^(.+?)\s+\|\s+(.+)$/);
    return m ? {title: m[1], lineup: m[2]} : {title: artist, lineup: ""};
  }
  // Undated events only show (in "Every week") if they say which day(s) they run.
  function isWeekly(e){ return WEEKDAYS.some(function(d){ return new RegExp(d, "i").test(e.recurring || ""); }); }
  function venueName(e){ return VENUES[e.venue] ? VENUES[e.venue].name : e.venue; }
  function imgTag(e, extraClass){
    // Cards show the event's own flyer, else the venue's logo -- never a
    // made-up graphic. imgFallback() walks this chain on load errors.
    var venueImage = VENUES[e.venue] && VENUES[e.venue].image;
    var chain = [e.image, venueImage].filter(function(u, i, a){ return u && a.indexOf(u) === i; });
    if(!chain.length) return "";
    // focus = where the face is in the flyer (set by the updater).
    var style = (e.focus && e.image) ? ' style="object-position:' + esc(e.focus) + '"' : '';
    return '<img src="' + esc(chain[0]) + '" alt="" loading="lazy"' + style +
      ' data-fallbacks="' + esc(chain.slice(1).join("|")) + '" onerror="imgFallback(this)">';
  }
  function genrePill(g){
    var c = GENRE_COLORS[g];
    return c ? '<span class="pill" style="--c:' + c + '">' + esc(g) + '</span>' : '';
  }

  var venueSelect = document.getElementById("venueSelect");
  var genreSelect = document.getElementById("genreSelect");
  var searchInput = document.getElementById("searchInput");
  var eventsContainer = document.getElementById("eventsContainer");
  var weeklyContainer = document.getElementById("weeklyContainer");
  var weeklySection = document.getElementById("every-week");
  var monthTabs = document.getElementById("monthTabs");

  document.getElementById("lastUpdated").textContent = typeof LAST_UPDATED !== "undefined" ? LAST_UPDATED : "";
  document.getElementById("closedNote").textContent = typeof CLOSED_VENUES_NOTE !== "undefined" ? CLOSED_VENUES_NOTE : "";

  // Venue / genre chips (native selects under the chip, so they work everywhere)
  // Venues ordered by how many shows they have on the site right now
  // (upcoming + weekly), most first; ties alphabetical.
  var venueCounts = {};
  EVENTS.forEach(function(e){
    if(!e.date || e.date >= todayStr()) venueCounts[e.venue] = (venueCounts[e.venue] || 0) + 1;
  });
  Object.keys(VENUES)
    .filter(function(key){ return !VENUES[key].closed; })
    .sort(function(a,b){
      return (venueCounts[b] || 0) - (venueCounts[a] || 0) || VENUES[a].name.localeCompare(VENUES[b].name);
    })
    .forEach(function(key){
      var opt = document.createElement("option");
      opt.value = key; opt.textContent = VENUES[key].name;
      venueSelect.appendChild(opt);
    });
  // Only genres with at least one event are listed.
  MAIN_GENRES.filter(function(g){
    return EVENTS.some(function(e){ return e.genre === g; });
  }).forEach(function(g){
    var opt = document.createElement("option");
    opt.value = g; opt.textContent = g;
    genreSelect.appendChild(opt);
  });
  function syncSelectChip(select, chipId, labelId, fallback){
    var on = !!select.value;
    document.getElementById(chipId).classList.toggle("active", on);
    document.getElementById(labelId).textContent = on ? select.options[select.selectedIndex].text : fallback;
  }

  // Tonight / This weekend (one at a time)
  var whenFilter = "";
  var whenChips = document.querySelectorAll(".chip[data-when]");
  function syncToggleChips(){
    whenChips.forEach(function(c){
      var on = c.getAttribute("data-when") === whenFilter;
      c.classList.toggle("active", on); c.setAttribute("aria-pressed", String(on));
    });
  }
  whenChips.forEach(function(c){
    c.addEventListener("click", function(){
      var w = c.getAttribute("data-when");
      whenFilter = whenFilter === w ? "" : w;
      syncToggleChips(); render();
    });
  });

  // Month row: picking a month shows only that month's events until "All" or
  // another month is picked. Every month from first to last is listed, so the
  // site never skips one (e.g. shows March without February).
  var startMonth = "";
  function monthRange(first, last){
    var out = [], y = Number(first.slice(0,4)), m = Number(first.slice(5,7));
    while(true){
      var ym = y + "-" + String(m).padStart(2,"0");
      out.push(ym);
      if(ym >= last) break;
      m++; if(m > 12){ m = 1; y++; }
    }
    return out;
  }
  function monthShort(ym){
    var dt = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7))-1, 1);
    var label = dt.toLocaleDateString("en-US",{month:"short"}).toUpperCase();
    return Number(ym.slice(0,4)) !== new Date().getFullYear() ? label + " ’" + ym.slice(2,4) : label;
  }
  function monthLong(ym){
    return new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7))-1, 1)
      .toLocaleDateString("en-US",{month:"long",year:"numeric"});
  }
  function renderMonthTabs(){
    var todayKey = todayStr(), months = [];
    EVENTS.forEach(function(e){
      if(!e.date || e.date < todayKey) return;
      var ym = e.date.slice(0, 7);
      if(months.indexOf(ym) === -1) months.push(ym);
    });
    months.sort();
    if(months.length) months = monthRange(months[0], months[months.length-1]);
    if(startMonth && months.indexOf(startMonth) === -1) startMonth = "";
    monthTabs.innerHTML = [{ym:"", label:"ALL"}].concat(months.map(function(ym){
      return {ym:ym, label:monthShort(ym)};
    })).map(function(t){
      var on = t.ym === startMonth;
      return '<button type="button" class="month' + (on ? ' active' : '') + '" data-month="' + t.ym + '"' +
        (on ? ' aria-current="true"' : '') + '>' + t.label + '</button>';
    }).join("");
  }
  monthTabs.addEventListener("click", function(ev){
    var btn = ev.target.closest(".month");
    if(!btn) return;
    var ym = btn.getAttribute("data-month");
    if(ym === startMonth) return;
    startMonth = ym;
    renderMonthTabs(); render();
    btn = monthTabs.querySelector('.month[data-month="' + ym + '"]');
    if(btn) btn.scrollIntoView({block:"nearest", inline:"center"});
  });

  function cardHTML(e){
    var t = splitTitle(e.artist);
    var meta = [shortTime(e.time), venueName(e), e.price].filter(Boolean).map(esc).join(" &middot; ");
    var actions;
    if(e.free){
      actions = '<a class="info-link" href="' + esc(e.direct) + '" target="_blank" rel="noopener">Event info &rarr;</a>';
    } else {
      // Venues flagged noResale (e.g. Sounders) only ever get the direct link.
      var resale = (VENUES[e.venue] && VENUES[e.venue].noResale ? [] : (e.resale || [])).map(function(r){
        return '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.site) + '</a>';
      }).join(" &middot; ");
      actions = '<a class="btn-tickets" href="' + esc(e.direct) + '" target="_blank" rel="noopener">Tickets</a>' +
        (resale ? '<span class="resale">' + resale + '</span>' : '');
    }
    return (
      '<article class="ev">' +
        '<div class="thumb">' + imgTag(e) + '</div>' +
        '<div class="ev-body">' +
          '<div class="tags">' + genrePill(e.genre) + (e.free ? '<span class="pill free">FREE</span>' : '') + '</div>' +
          '<div class="ev-title">' + esc(t.title) + '</div>' +
          (t.lineup ? '<div class="lineup">' + esc(t.lineup) + '</div>' : '') +
          '<div class="meta">' + meta + '</div>' +
          '<div class="actions">' + actions + '</div>' +
        '</div>' +
      '</article>'
    );
  }

  // "Weekly on Sundays" -> "SUNDAYS", "Every Friday & Saturday" -> "FRIDAYS & SATURDAYS"
  function weeklyDays(e){
    var days = WEEKDAYS.filter(function(d){ return new RegExp(d, "i").test(e.recurring || ""); });
    return days.length ? days.map(function(d){ return d.toUpperCase() + "S"; }).join(" & ") : (e.recurring || "").toUpperCase();
  }
  function weeklyHTML(e){
    // Recurring series are usually free: "Event Info" to the venue / series
    // page, never resale.
    return (
      '<article class="ev wk">' +
        '<div class="thumb square">' + imgTag(e) + '</div>' +
        '<div class="ev-body">' +
          '<div class="tags">' + genrePill(e.genre) + '</div>' +
          '<div class="ev-title">' + esc(e.artist) + '</div>' +
          '<div class="wk-when">' + esc(weeklyDays(e)) + (e.time ? ' &middot; ' + esc(shortTime(e.time)) : '') + '</div>' +
          '<div class="meta">' + esc(venueName(e)) + '</div>' +
          '<div class="actions"><a class="btn-tickets" href="' + esc(e.direct) + '" target="_blank" rel="noopener">Event Info</a></div>' +
        '</div>' +
      '</article>'
    );
  }

  function matchesCommon(e, q){
    if(venueSelect.value && e.venue !== venueSelect.value) return false;
    if(genreSelect.value && e.genre !== genreSelect.value) return false;
    if(q){
      var hay = (e.artist + " " + venueName(e)).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function render(){
    var q = searchInput.value.trim().toLowerCase();
    var todayKey = todayStr(), tomorrowKey = addDays(todayKey, 1);
    var range = whenFilter === "tonight" ? [todayKey, todayKey]
              : whenFilter === "weekend" ? weekendRange(todayKey) : null;

    var dated = EVENTS.filter(function(e){
      if(!e.date || e.date < todayKey) return false;
      if(startMonth && e.date.slice(0, 7) !== startMonth) return false;
      if(range && (e.date < range[0] || e.date > range[1])) return false;
      return matchesCommon(e, q);
    }).sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var byDay = {};
    dated.forEach(function(e){ (byDay[e.date] = byDay[e.date] || []).push(e); });

    // Month sections from the first to the last month shown (or just the
    // picked month), each with its day groups; empty months still appear.
    var months = startMonth ? [startMonth]
      : (dated.length && !range ? monthRange(dated[0].date.slice(0,7), dated[dated.length-1].date.slice(0,7)) : []);
    if(range && dated.length) months = dated.map(function(e){ return e.date.slice(0,7); })
      .filter(function(m, i, a){ return a.indexOf(m) === i; });

    var html = "";
    months.forEach(function(ym){
      html += '<h2 class="month-head">' + esc(monthLong(ym)) + '</h2>';
      var days = Object.keys(byDay).filter(function(d){ return d.slice(0,7) === ym; }).sort();
      if(!days.length){ html += '<p class="empty">No events announced yet.</p>'; return; }
      days.forEach(function(d){
        var n = byDay[d].length;
        var soon = d === todayKey ? "TONIGHT" : d === tomorrowKey ? "TOMORROW" : "";
        html += '<div class="day-head"><h3>' + esc(parseDate(d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})) + '</h3>' +
          '<span class="day-count">' + (soon ? '<span class="soon">' + soon + '</span> &middot; ' : '') + n + (n === 1 ? ' SHOW' : ' SHOWS') + '</span></div>' +
          '<div class="cards">' + byDay[d].map(cardHTML).join("") + '</div>';
      });
    });
    if(!dated.length && !startMonth){
      html = '<p class="no-results">No shows match these filters.</p>';
    }
    eventsContainer.innerHTML = html;

    // Every week: hidden while a specific month or date filter is on.
    var weekly = (startMonth || range) ? [] : EVENTS.filter(function(e){ return !e.date && isWeekly(e) && matchesCommon(e, q); });
    weeklySection.hidden = !weekly.length;
    weeklyContainer.innerHTML = weekly.map(weeklyHTML).join("");
    clearBtn.disabled = !(q || whenFilter || genreSelect.value || venueSelect.value || startMonth);
  }

  // Clear filters: search, Tonight / This weekend, genre, venue and month.
  var clearBtn = document.getElementById("clearFilters");
  clearBtn.addEventListener("click", function(){
    searchInput.value = "";
    whenFilter = "";
    genreSelect.value = "";
    venueSelect.value = "";
    startMonth = "";
    syncToggleChips();
    syncSelectChip(genreSelect, "genreChip", "genreLabel", "Genre");
    syncSelectChip(venueSelect, "venueChip", "venueLabel", "Venue");
    renderMonthTabs();
    render();
    monthTabs.scrollLeft = 0;
  });

  venueSelect.addEventListener("change", function(){ syncSelectChip(venueSelect, "venueChip", "venueLabel", "Venue"); render(); });
  genreSelect.addEventListener("change", function(){ syncSelectChip(genreSelect, "genreChip", "genreLabel", "Genre"); render(); });
  searchInput.addEventListener("input", render);

  renderMonthTabs();
  render();
})();
</script>

</body>
</html>
