<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="impact-site-verification" value="542e9681-75be-44b8-a4c7-a84bc7050674">
<title>DFW EDM &amp; House Events</title>
<style>
  :root{
    --bg:#0a0a10;
    --bg2:#0f0f18;
    --card:#14141f;
    --border:#23232f;
    --text:#f2f2f6;
    --sub:#9a9aa8;
    --muted:#6f6f7d;
    --pink:#ec4899;
    --purple:#8b5cf6;
    --blue:#3b82f6;
    --cyan:#22d3ee;
    --orange:#f97316;
    --gold:#eab308;
    --green:#22c55e;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:inherit;text-decoration:none;}

  header.nav{
    display:flex;align-items:center;gap:16px;
    padding:18px 28px;border-bottom:1px solid var(--border);
    background:var(--bg2);flex-wrap:wrap;
  }

  .logo{margin-right:auto;display:block;line-height:0;}
  .logo img{
    width:56px;height:56px;display:block;
    border-radius:50%;border:2px solid #fff;
  }
  .search-input{
    flex:1;min-width:180px;max-width:340px;
    background:#101018;border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:10px 14px;font-size:14px;outline:none;
  }
  .search-input::placeholder{color:var(--muted);}
  .search-input:focus{border-color:var(--purple);}

  select.dropdown{
    appearance:none;-webkit-appearance:none;
    background:#ffffff;color:#1a1a24;
    border:1px solid #e4e4ea;border-radius:10px;
    padding:10px 36px 10px 14px;font-size:14px;font-weight:600;
    cursor:pointer;min-width:150px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%236b6b78'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
    box-shadow:0 1px 2px rgba(0,0,0,0.15);
    transition:box-shadow .15s ease, transform .1s ease;
  }
  select.dropdown:hover{box-shadow:0 2px 8px rgba(236,72,153,0.18);}
  select.dropdown:focus{outline:none;box-shadow:0 0 0 3px rgba(139,92,246,0.35);}

  .hero{padding:40px 28px 0;position:relative;overflow:hidden;max-width:1400px;margin:0 auto;}
  .subtitle{color:var(--sub);font-size:16px;margin:0;max-width:640px;}
  .subtitle-mobile{display:none;}
  .month-tabs{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;
    margin:24px 0 0;padding-bottom:14px;font-size:14px;font-weight:700;
    border-bottom:1px solid rgba(255,255,255,0.07);
    text-transform:uppercase;letter-spacing:1px;
  }
  .month-tab{
    background:none;border:none;color:var(--sub);cursor:pointer;
    font:inherit;letter-spacing:inherit;text-transform:inherit;
    padding:4px 2px;border-bottom:2px solid transparent;
  }
  .month-tab:hover{color:var(--text);}
  .month-tab.active{color:var(--text);border-bottom-color:var(--pink);}
  .month-empty{color:var(--muted);font-size:14px;margin:0;}
  .month-sep{color:var(--muted);padding:0 12px;user-select:none;}

  main{padding:8px 28px 60px;max-width:1400px;margin:0 auto;}
  .month-header{
    font-size:14px;font-weight:700;color:var(--sub);
    text-transform:uppercase;letter-spacing:1px;
    margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }
  #eventsContainer > .month-header:first-child{margin-top:22px;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:#3a3a4c;}
  .card-image{
    height:150px;position:relative;overflow:hidden;background:#000;
  }
  .card-image img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  .card-image::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(10,10,16,0.05), rgba(10,10,16,0.65));
  }
  .genre-badge{
    position:absolute;top:10px;left:10px;z-index:1;
    background:rgba(10,10,16,0.75);backdrop-filter:blur(4px);
    color:#fff;font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:999px;
  }
  .card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card-artist{font-size:16px;font-weight:700;line-height:1.25;}
  .card-meta{font-size:13px;color:var(--sub);}
  .card-venue{font-size:13px;color:var(--muted);}
  .card-actions{display:flex;align-items:stretch;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{
    display:flex;align-items:center;justify-content:center;
    height:38px;
    font-size:12px;font-weight:700;padding:0 10px;border-radius:8px;
    border:1px solid var(--border);flex:1;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .btn-direct{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border:none;}
  .btn-resale{background:transparent;color:var(--sub);}
  .btn-resale:hover{color:var(--text);border-color:#3a3a4c;}

  .closed-note{margin-top:40px;font-size:13px;color:var(--muted);font-style:italic;}

  footer{padding:24px 28px 40px;color:var(--muted);font-size:12px;text-align:center;}

  @media (max-width:640px){
    /* Phones: description beside the logo, search + filters full width below. */
    header.nav{
      display:grid;grid-template-columns:auto minmax(0,1fr);
      column-gap:14px;row-gap:8px;align-items:center;padding:14px 16px;
    }
    .logo{grid-column:1;margin:0;}
    .subtitle-mobile{display:block;grid-column:2;font-size:14px;line-height:1.4;}
    .subtitle-desktop{display:none;}
    .search-input,select.dropdown{grid-column:1 / -1;width:100%;max-width:none;min-width:0;}
    .search-input{margin-top:6px;}
    .hero{padding-top:20px;}
    .month-tabs{margin-top:0;}
  }
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="/"><img src="logo.png" alt="DFW EDM"></a>
  <p class="subtitle subtitle-mobile">Your home for Dallas-Fort Worth electronic music events, artists, and venues. All in one place.</p>
  <input type="text" class="search-input" id="searchInput" placeholder="Search artist or venue...">
  <select class="dropdown" id="venueSelect"><option value="">All Venues</option></select>
  <select class="dropdown" id="genreSelect"><option value="">All Genres</option></select>
</header>

<section class="hero">
  <p class="subtitle subtitle-desktop">Your home for Dallas-Fort Worth electronic music events, artists, and venues. All in one place.</p>
  <nav class="month-tabs" id="monthTabs" aria-label="Jump to month"></nav>
</section>

<main id="app">
  <div id="eventsContainer"></div>
  <p class="closed-note" id="closedNote"></p>
</main>

<footer>DFW EDM &middot; refreshed weekly &middot; last updated <span id="lastUpdated"></span></footer>

<script>
  // Bust browser caches every 10 minutes so new event lists show up promptly.
  document.write('<script src="events.js?v=' + Math.floor(Date.now() / 600000) + '"><\/script>');
</script>
<script>
function imgFallback(img){
  var rest = (img.getAttribute("data-fallbacks") || "").split("|").filter(Boolean);
  if(!rest.length){ img.onerror = null; img.style.visibility = "hidden"; return; }
  img.style.objectPosition = "";  // focus was for the flyer, not the venue logo
  img.setAttribute("data-fallbacks", rest.slice(1).join("|"));
  img.src = rest[0];
}
(function(){
  function fmtDate(d){
    if(!d) return "Recurring";
    var parts = d.split("-");
    var dt = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  }
  function monthKey(d){
    if(!d) return "Recurring";
    var parts = d.split("-");
    var dt = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    return dt.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  }
  // "Today" for filtering purposes is shifted 30 minutes late, so an event
  // dated today doesn't disappear right at midnight -- it stays up until
  // 12:30 AM the following day, since people sometimes head out last-minute.
  function todayStr(){
    var d = new Date(Date.now() - 30 * 60 * 1000);
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  var venueSelect = document.getElementById("venueSelect");
  var genreSelect = document.getElementById("genreSelect");
  var searchInput = document.getElementById("searchInput");
  var eventsContainer = document.getElementById("eventsContainer");
  var closedNote = document.getElementById("closedNote");
  var lastUpdatedEl = document.getElementById("lastUpdated");

  lastUpdatedEl.textContent = typeof LAST_UPDATED !== "undefined" ? LAST_UPDATED : "";
  closedNote.textContent = typeof CLOSED_VENUES_NOTE !== "undefined" ? CLOSED_VENUES_NOTE : "";

  Object.keys(VENUES)
    .filter(function(key){ return !VENUES[key].closed; })
    .sort(function(a,b){ return VENUES[a].name.localeCompare(VENUES[b].name); })
    .forEach(function(key){
      var opt = document.createElement("option");
      opt.value = key;
      opt.textContent = VENUES[key].name;
      venueSelect.appendChild(opt);
    });

  var genres = [];
  EVENTS.forEach(function(e){
    if(e.genre && genres.indexOf(e.genre) === -1) genres.push(e.genre);
  });
  genres.sort().forEach(function(g){
    var opt = document.createElement("option");
    opt.value = g; opt.textContent = g;
    genreSelect.appendChild(opt);
  });

  function cardHTML(e){
    var venueName = VENUES[e.venue] ? VENUES[e.venue].name : e.venue;
    // Cards show the event's own flyer, else the venue's logo -- never a
    // made-up graphic. imgFallback() walks this chain on load errors.
    var venueImage = VENUES[e.venue] && VENUES[e.venue].image;
    // focus = where the face is in the flyer (set by the updater), so the
    // strip shows the face instead of the middle of the image.
    var focusStyle = (e.focus && e.image) ? ' style="object-position:' + e.focus + '"' : '';
    var chain = [e.image, venueImage].filter(function(u, i, a){ return u && a.indexOf(u) === i; });
    // Recurring series only ever get the direct link -- no resale buttons.
    var resaleLinks = (e.date ? (e.resale||[]) : []).map(function(r){
      return '<a class="btn btn-resale" href="' + r.url + '" target="_blank" rel="noopener">' + r.site + '</a>';
    }).join("");
    return (
      '<div class="card">' +
        '<div class="card-image">' +
          (chain.length ? '<img src="' + chain[0] + '" alt="" loading="lazy"' + focusStyle + ' data-fallbacks="' + chain.slice(1).join("|") + '" onerror="imgFallback(this)">' : '') +
          '<span class="genre-badge">' + (e.genre || "") + '</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-artist">' + e.artist + '</div>' +
          '<div class="card-meta">' + (e.recurring ? e.recurring : fmtDate(e.date)) + (e.time ? " &middot; " + e.time : "") + '</div>' +
          '<div class="card-venue">' + venueName + '</div>' +
          '<div class="card-actions">' +
            '<a class="btn btn-direct" href="' + e.direct + '" target="_blank" rel="noopener">Buy Direct</a>' +
            resaleLinks +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // Month tabs: picking a month shows only that month's events (no recurring
  // section) until "All" or another month is picked.
  var startMonth = "";
  // Every month from first to last, so the site never skips one (e.g. shows
  // March 2027 without February) even when a month has no events yet.
  function monthRange(first, last){
    var out = [];
    var y = Number(first.slice(0,4)), m = Number(first.slice(5,7));
    while(true){
      var ym = y + "-" + String(m).padStart(2,"0");
      out.push(ym);
      if(ym >= last) break;
      m++; if(m > 12){ m = 1; y++; }
    }
    return out;
  }
  function monthLabel(ym){
    var dt = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7))-1, 1);
    return dt.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  }
  var monthTabs = document.getElementById("monthTabs");
  function renderMonthTabs(){
    var todayKey = todayStr();
    var months = [];
    EVENTS.forEach(function(e){
      if(!e.date || e.date < todayKey) return;
      var ym = e.date.slice(0, 7);
      if(months.indexOf(ym) === -1) months.push(ym);
    });
    months.sort();
    if(months.length) months = monthRange(months[0], months[months.length-1]);
    if(startMonth && months.indexOf(startMonth) === -1) startMonth = "";
    var tabs = [{ym:"", label:"All"}].concat(months.map(function(ym){
      var dt = new Date(Number(ym.slice(0,4)), Number(ym.slice(5,7))-1, 1);
      return {ym:ym, label:dt.toLocaleDateString("en-US",{month:"short",year:"numeric"})};
    }));
    monthTabs.innerHTML = tabs.map(function(t){
      return '<button type="button" class="month-tab' + (t.ym === startMonth ? ' active' : '') + '" data-month="' + t.ym + '">' + t.label + '</button>';
    }).join('<span class="month-sep" aria-hidden="true">|</span>');
  }
  monthTabs.addEventListener("click", function(ev){
    var btn = ev.target.closest(".month-tab");
    if(!btn) return;
    var ym = btn.getAttribute("data-month");
    if(ym === startMonth) return;
    startMonth = ym;
    renderMonthTabs();
    render();
  });

  function render(){
    var venueFilter = venueSelect.value;
    var genreFilter = genreSelect.value;
    var q = searchInput.value.trim().toLowerCase();
    var todayKey = todayStr();

    var filtered = EVENTS.filter(function(e){
      if(e.date && e.date < todayKey) return false;
      if(startMonth && (!e.date || e.date.slice(0, 7) !== startMonth)) return false;
      if(venueFilter && e.venue !== venueFilter) return false;
      if(genreFilter && e.genre !== genreFilter) return false;
      if(q){
        var venueName = VENUES[e.venue] ? VENUES[e.venue].name.toLowerCase() : "";
        if(e.artist.toLowerCase().indexOf(q)===-1 && venueName.indexOf(q)===-1) return false;
      }
      return true;
    });

    filtered.sort(function(a,b){
      if(!a.date && !b.date) return 0;
      if(!a.date) return -1;
      if(!b.date) return 1;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });

    var groups = [];
    var groupMap = {};
    filtered.forEach(function(e){
      var mk = monthKey(e.date);
      if(!groupMap[mk]){
        groupMap[mk] = [];
        groups.push(mk);
      }
      groupMap[mk].push(e);
    });

    // Fill in months with no events between the first and last month shown
    // (or show the picked month even if it's empty).
    var dated = filtered.filter(function(e){ return e.date; }).map(function(e){ return e.date.slice(0,7); });
    var fillMonths = startMonth ? [startMonth]
      : (dated.length ? monthRange(dated[0], dated[dated.length-1]) : []);
    var ordered = groups.indexOf("Recurring") !== -1 ? ["Recurring"] : [];
    fillMonths.forEach(function(ym){
      var mk = monthLabel(ym);
      if(!groupMap[mk]) groupMap[mk] = [];
      ordered.push(mk);
    });

    var html = "";
    ordered.forEach(function(mk){
      html += '<div class="month-header">' + mk + '</div>';
      html += groupMap[mk].length
        ? '<div class="grid">' + groupMap[mk].map(cardHTML).join("") + '</div>'
        : '<p class="month-empty">No events announced yet.</p>';
    });
    if(!filtered.length && !startMonth){
      html = '<p style="color:var(--muted);padding:40px 0;">No events match your filters.</p>';
    }
    eventsContainer.innerHTML = html;
  }

  venueSelect.addEventListener("change", render);
  genreSelect.addEventListener("change", render);
  searchInput.addEventListener("input", render);

  renderMonthTabs();
  render();
})();
</script>

</body>
</html>
