<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Redirecting…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a10;color:#f2f2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;}
  a{color:#ec4899;}
</style>
</head>
<body>
<div>
  <p>Redirecting to tickets&hellip;</p>
  <p><a id="fallback" href="/">Tap here if you're not redirected</a></p>
</div>
<script>
  var params = new URLSearchParams(window.location.search);
  var to = params.get("to");
  if (to) {
    document.getElementById("fallback").href = to;
    window.location.replace(to);
  }
</script>
</body>
</html>
