name: Weekly events update

on:
  schedule:
    # Every 3 days at 9:00 UTC (~4am Central)
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic "opencv-python-headless==4.10.0.84"

      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 update_events.py

      - name: Commit and push if changed
        run: |
          git config user.name "edmdfw-bot"
          git config user.email "actions@github.com"
          # Re-sync with whatever is currently on the remote before committing.
          # The updater takes several minutes to run, so main can move (a merged
          # PR, a manual upload) while it's working. Set the freshly generated
          # files aside, move to the latest remote main, then put ONLY those
          # files back -- so this commit can never undo other changes to the
          # site. (A `git reset --soft` here used to commit the run's stale copy
          # of index.html, reverting PRs merged mid-run.)
          cp events.js events_data.json "$RUNNER_TEMP/"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/events.js" "$RUNNER_TEMP/events_data.json" .
          git diff --quiet -- events.js events_data.json || (git add events.js events_data.json && git commit -m "Automated events update" && git push origin main)
