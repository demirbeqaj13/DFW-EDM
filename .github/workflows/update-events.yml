name: Weekly events update

on:
  schedule:
    # Every 3 days at 9:00 UTC (~4am Central)
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 update_events.py

      - name: Commit and push if changed
        run: |
          git config user.name "edmdfw-bot"
          git config user.email "actions@github.com"
          # Re-sync with whatever is currently on the remote before committing.
          # The updater takes several minutes to run, so main can move (a manual
          # upload, another run) while it's working. events.js is fully
          # regenerated from scratch each run (not diffed against the old file),
          # so it's always safe to rebase our starting point onto the latest
          # remote commit right before we commit -- this avoids "rejected:
          # fetch first" failures instead of just discovering them at push time.
          git fetch origin main
          git reset --soft origin/main
          git diff --quiet -- events.js || (git add events.js && git commit -m "Automated events update" && git push origin main)
