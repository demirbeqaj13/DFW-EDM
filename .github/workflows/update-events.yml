name: Weekly events update

on:
  schedule:
    # Every Monday 9:00 UTC (~4am Central)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 update_events.py

      - name: Commit and push if changed
        run: |
          git config user.name "edmdfw-bot"
          git config user.email "actions@github.com"
          git diff --quiet -- events.js || (git add events.js && git commit -m "Automated weekly events update" && git push)
